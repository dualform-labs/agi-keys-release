<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Context compaction</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 14px; color: #ddd; background: #2d2d2d; font-size: 12px; }
    label { display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 8px; margin-bottom: 9px; }
    input[type="text"], select { box-sizing: border-box; width: 100%; min-height: 28px; color: #eee; background: #3b3b3b; border: 1px solid #555; border-radius: 4px; padding: 3px 7px; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: #1683ff; }
    p { margin: 12px 0 0 116px; color: #a9a9a9; line-height: 1.35; }
    #press-command-row[hidden] { display: none; }
  </style>
</head>
<body>
  <label><span id="label-title">Label</span><input id="label" type="text" maxlength="24" placeholder="Default"></label>
  <label><span id="language-title">Language</span><select id="language"><option value="ja">Japanese</option><option value="en">English</option></select></label>
  <label><span id="text-size-title">Text size</span><select id="textSize"><option value="normal">Normal</option><option value="large">Large</option></select></label>
  <label><span id="theme-title">Theme</span><select id="theme"><option value="auto">Automatic</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
  <label><span id="details-title">Show details</span><input id="showDetails" type="checkbox" checked></label>
  <label><span id="animation-title">Animation</span><input id="animation" type="checkbox" checked></label>
  <label><span id="focus-title">Bring ChatGPT / Codex to front</span><input id="focusBeforeAction" type="checkbox"></label>
  <label><span id="press-title">On press</span><select id="pressBehavior">
    <optgroup id="behavior-group-basic" label="Basic">
      <option value="none">Compact context</option><option value="disabled">Do nothing</option><option value="refresh">Refresh display</option><option value="focus">Bring ChatGPT / Codex to front</option>
    </optgroup>
    <optgroup id="behavior-group-common" label="Common actions">
      <option value="command:CODEX">Send to current Codex</option><option value="command:NEW">New task</option><option value="command:PARTY">Side chat</option><option value="ptt">Voice PTT (while held)</option><option value="command:APPR">Approve</option><option value="command:REJ">Reject</option><option value="command:FAST">Fast mode</option>
    </optgroup>
    <optgroup id="behavior-group-model" label="Model &amp; reasoning">
      <option value="model-next">Next model</option><option value="model-previous">Previous model</option><option value="reasoning-increase">Increase reasoning</option><option value="reasoning-decrease">Decrease reasoning</option>
    </optgroup>
    <optgroup id="behavior-group-other" label="Other"><option value="command">Choose from all Codex actions</option></optgroup>
  </select></label>
  <label id="press-command-row" hidden><span id="press-command-title">Codex action</span><select id="pressCommand">
    <option value="">Select an action</option>
    <optgroup id="command-group-conversation" label="Conversation &amp; reasoning">
      <option value="FAST">Fast mode</option><option value="APPR">Approve</option><option value="REJ">Reject</option><option value="SPLIT">Split chat</option><option value="CODEX">Send message</option><option value="NEW">New chat</option><option value="MIND+">Increase reasoning</option><option value="MIND-">Decrease reasoning</option>
    </optgroup>
    <optgroup id="command-group-chat" label="Chat &amp; view">
      <option value="DWN">Copy chat as Markdown</option><option value="DEL">Archive chat</option><option value="NAV">Browser tab</option><option value="MAGIC">Pin chat</option><option value="DIFF">Show review</option><option value="PARTY">Side chat</option><option value="TIME">Task manager</option><option value="BUG">Feedback</option>
    </optgroup>
    <optgroup id="command-group-development" label="Development">
      <option value="PLAY">Run main action</option><option value="GIT">Commit or push</option><option value="BRCH">Create draft PR</option><option value="BRANCH">Create branch</option><option value="MRG">Merge PR</option><option value="PR">Create PR</option><option value="PAINT">Add photos</option><option value="LAB">Codex Micro settings</option>
    </optgroup>
    <optgroup id="command-group-workspace" label="Tools &amp; workspace">
      <option value="OAI">OpenAI docs</option><option value="TERM">Terminal</option><option value="SETUP">Settings</option><option value="FOLD">Open folder</option><option value="UPL">Attach files</option><option value="APPS">Plugins</option><option value="YOLO">Type :yolo:</option><option value="YEET">Type :yeet:</option>
    </optgroup>
  </select></label>
  <p id="press-help">The default requests native compaction for the active Codex task. Display actions leave context unchanged.</p>
  <script src="shared.js"></script>
  <script>
    window.CodexPropertyInspector.contextCompaction();
  </script>
</body>
</html>
